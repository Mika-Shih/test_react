# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

pool:
  name: Default

steps:
- script: |
    wsl bash -c "cd /home/mika/test_django"
    wsl bash -c "source /home/mika/test_django/venv/bin/activate && pip install -r /home/mika/test_django/requirements.txt"
    wsl bash -c "cd /home/mika/test_django/mysite && python manage.py migrate"
    wsl bash -c "cd /home/mika/test_django/mysite && nohup python manage.py runserver 0.0.0.0:8000 &"
  displayName: 'Deploy Django backend in WSL'





