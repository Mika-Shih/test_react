# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'     # Node 20 還是會有這問題
  displayName: 'Install Node.js'

- script: |
    export NODE_OPTIONS=--openssl-legacy-provider
    npm install
    npm run build
  displayName: 'Build React'
  workingDirectory: 'django-react-soft-dashboard-main/react-ui'

- task: CopyFilesOverSSH@0
  inputs:
    sshEndpoint: 'WSL-Ubuntu'
    sourceFolder: 'django-react-soft-dashboard-main/react-ui/build'
    contents: '**'
    targetFolder: '/var/www/html'
  displayName: 'Copy build to nginx path'

- task: SSH@0
  inputs:
    sshEndpoint: 'WSL-Ubuntu'
    runOptions: 'inline'
    inline: |
      sudo systemctl restart nginx
  displayName: 'Restart nginx in WSL'

